:root{--accent:#1B5E20;--accent2:#2E7D32;--bg:#F4F6F4;--card:#ffffff;--text:#222222;--muted:#777777;--line:#e5e5e5;--red:#C62828;--green:#2E7D32;--fs:16px}
body[data-theme="blue"]{--accent:#1565C0;--accent2:#1E88E5}
body[data-theme="orange"]{--accent:#E65100;--accent2:#F57C00}
body[data-theme="purple"]{--accent:#6A1B9A;--accent2:#8E24AA}
body[data-theme="dark"]{--accent:#FFB300;--accent2:#FFB300;--bg:#141414;--card:#222222;--text:#f2f2f2;--muted:#aaaaaa;--line:#3a3a3a}
body.large-font{--fs:19px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs);line-height:1.55}
@keyframes sheetUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes viewFade{from{opacity:0}to{opacity:1}}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastUp{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;z-index:10}
header h1{font-size:21px}
header .date{font-size:13px;color:var(--muted)}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text);padding:6px;display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:24px;height:24px;display:block}
main{max-width:560px;margin:0 auto;padding:14px 14px 110px}
.totals{display:flex;gap:10px;margin-bottom:14px}
.total{flex:1;background:var(--card);border-radius:14px;padding:14px;text-align:center;border:1px solid var(--line)}
.total span{font-size:13px;color:var(--muted)}
.total b{display:block;font-size:24px;margin-top:2px}
.total.red b{color:var(--red)}
.total.green b{color:var(--green)}
h2.sec{font-size:16px;margin:6px 2px 8px;color:var(--muted)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted)}
.fab{position:fixed;right:18px;bottom:20px;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:32px;line-height:1;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20;transition:transform .12s ease-out}
.fab:active{transform:scale(.9)}
.view{display:none}
.view.on{display:block;animation:viewFade .18s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.25);max-height:88vh;overflow:auto;z-index:30;padding:16px 16px 24px;max-width:560px;margin:0 auto;display:none}
.sheet.on{display:block;animation:sheetUp .22s ease-out}
.sheet h2{font-size:19px;margin-bottom:10px}
.seg{display:flex;gap:8px;margin:12px 0}
.seg button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--text);display:flex;align-items:center;justify-content:center;gap:7px}
.seg button.on-baki{background:#FFEBEE;border-color:var(--red);color:var(--red)}
.seg button.on-paid{background:#E8F5E9;border-color:var(--green);color:var(--green)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:0 0 10px}
.dot.red{background:var(--red)}
.dot.green{background:var(--green)}
.calc-display{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:right;font-size:26px;font-weight:700;min-height:56px;word-break:break-all}
.calc-display small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keypad button{padding:15px 0;font-size:20px;font-weight:700;font-family:inherit;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.keypad button.op{background:#FFF3E0}
.keypad button.eq{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=text]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:16px;margin-top:10px;background:var(--card);color:var(--text)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:14px}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.linkbtn{background:none;border:none;color:var(--accent);font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:6px}
.linkbtn svg{width:18px;height:18px}
.backbtn{background:none;border:none;font-size:16px;cursor:pointer;color:var(--text);font-family:inherit;padding:6px 0;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.backbtn svg{width:18px;height:18px}
.profile-top{text-align:center;padding:10px 0}
.profile-top h2{font-size:20px;margin-top:8px}
.minirow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;animation:rowIn .25s ease-out both}
.minirow .x{color:var(--red);background:none;border:none;cursor:pointer;padding:6px;display:flex;align-items:center}
.minirow .x svg{width:16px;height:16px;display:block}
.setrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.setrow b{display:block;margin-bottom:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.sel{border-color:var(--text)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#222;color:#fff;padding:11px 16px;border-radius:24px;font-size:15px;z-index:40;display:none;align-items:center;gap:12px;max-width:92vw}
#toast.show{display:flex;animation:toastUp .2s ease-out}
#toast button{background:none;border:none;color:#FFD54F;font-weight:700;font-family:inherit;font-size:15px;cursor:pointer}
#summaryBox{width:100%;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:12px;font-family:inherit;font-size:14px;background:var(--card);color:var(--text);margin-top:8px;display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
.overlay.on{display:block}

/* ===== v2: layout #3 two-column color cards ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border-radius:14px;padding:14px 12px;border:1px solid #e5e5e5;cursor:pointer;animation:rowIn .25s ease-out both}
.card .nm{font-size:18px;font-weight:700;line-height:1.3;word-break:break-word}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.card .net2{font-size:15px;font-weight:700;margin-top:6px}
.card .net2.red{color:var(--red)}
.card .net2.green{color:var(--green)}
.card .net2.zero{color:var(--muted)}
/* ===== v2: color dots + name rows (entry sheet pick step) ===== */
.namerow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;animation:rowIn .25s ease-out both}
.namerow b{flex:1;font-size:16px;min-width:0;word-break:break-word}
.namerow .freq{font-size:12px;color:var(--muted);white-space:nowrap}
.cdot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:0 0 14px;border:1px solid rgba(0,0,0,.15)}
.cdot.big{width:24px;height:24px;flex:0 0 24px}
.cdot.huge{width:52px;height:52px;flex:0 0 52px}
/* ===== v2: color picker swatches ===== */
.colorsw{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

.colorsw .csw.sel{border-color:var(--text)}

<script>
var STORE_KEY = 'dokanHisabV1';
var BN_MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
var store = { customers: [], entries: [], dayStart: 0, theme: 'green', fontLarge: false };
var currentCustomerId = null;
var entryType = 'baki';
var calcExpr = '';
var editingEntryId = null;
var lastUndo = null;
var toastTimer = null;
var newCustColor = 0;

/* v2: per-customer colors — 10 distinct tints (bg = card tint, border = strong color) */
var PALETTE = [
  { bg: '#E8F5E9', border: '#66BB6A' },
  { bg: '#E3F2FD', border: '#42A5F5' },
  { bg: '#FFF3E0', border: '#FFA726' },
  { bg: '#F3E5F5', border: '#AB47BC' },
  { bg: '#FFEBEE', border: '#EF5350' },
  { bg: '#E0F2F1', border: '#26A69A' },
  { bg: '#FFF8E1', border: '#FFCA28' },
  { bg: '#FCE4EC', border: '#EC407A' },
  { bg: '#EDE7F6', border: '#7E57C2' },
  { bg: '#EFEBE9', border: '#8D6E63' }
];
function colorOf(c) {
  var i = (c && typeof c.color === 'number' && c.color >= 0 && c.color < PALETTE.length) ? c.color : 0;
  return PALETTE[i];
}
/* least-used color among customers; never the same as the most recently added customer's */
function nextColorIdx() {
  var counts = [];
  for (var i = 0; i < PALETTE.length; i++) { counts.push(0); }
  store.customers.forEach(function (c) {
    if (typeof c.color === 'number' && c.color >= 0 && c.color < PALETTE.length) { counts[c.color]++; }
  });
  var lastColor = null, lastAt = -1;
  store.customers.forEach(function (c) {
    if (c.createdAt > lastAt) { lastAt = c.createdAt; lastColor = (typeof c.color === 'number') ? c.color : null; }
  });
  var best = -1, bestCount = Infinity;
  for (var j = 0; j < PALETTE.length; j++) {
    if (j === lastColor) { continue; }
    if (counts[j] < bestCount) { bestCount = counts[j]; best = j; }
  }
  if (best === -1) { best = ((lastColor == null ? -1 : lastColor) + 1) % PALETTE.length; }
  return best;
}

function bnDigits(s) {
  return String(s).replace(/[0-9]/g, function (d) { return '০১২৩৪৫৬৭৮৯'[Number(d)]; });
}
function fmtTk(n) {
  var v = Math.round(Number(n) || 0);
  var s = v.toLocaleString('en-US');
  return '৳' + bnDigits(s);
}
function fmtTime(ts) {
  var d = new Date(ts);
  var h = d.getHours(); var m = d.getMinutes();
  var hh = (h < 10 ? '0' : '') + h; var mm = (m < 10 ? '0' : '') + m;
  return bnDigits(hh + ':' + mm);
}
function periodLabel(ts) {
  var h = new Date(ts).getHours();
  if (h < 12) { return 'সকাল'; }
  if (h < 16) { return 'দুপুর'; }
  if (h < 18) { return 'বিকেল'; }
  return 'সন্ধ্যা';
}
function dayKey(ts) {
  var d = new Date(ts);
  return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
}
function bnDateStr(d) {
  return bnDigits(d.getDate()) + ' ' + BN_MONTHS[d.getMonth()] + ' ' + bnDigits(d.getFullYear());
}
function loadStore() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      var s = JSON.parse(raw);
      if (s && s.customers) { store = s; }
    }
  } catch (e) {}
  if (!store.entries) { store.entries = []; }
  if (!store.customers) { store.customers = []; }
  if (!store.theme) { store.theme = 'green'; }
  /* v2 migration: every customer gets a color + oldBaki (v1 data carries over) */
  var changed = false;
  store.customers.forEach(function (c) {
    if (typeof c.color !== 'number' || c.color < 0 || c.color >= PALETTE.length) {
      c.color = nextColorIdx();
      changed = true;
    }
    if (typeof c.oldBaki !== 'number' || isNaN(c.oldBaki)) { c.oldBaki = 0; changed = true; }
    if (typeof c.createdAt !== 'number') { c.createdAt = 0; changed = true; }
  });
  if (changed) { saveStore(); }
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
function effectiveDayStart() {
  if (!store.dayStart) { return 0; }
  if (dayKey(store.dayStart) !== dayKey(Date.now())) { return 0; }
  return store.dayStart;
}
function todayEntries() {
  var ds = effectiveDayStart();
  var tk = dayKey(Date.now());
  return store.entries.filter(function (e) {
    return dayKey(e.ts) === tk && e.ts >= ds;
  }).sort(function (a, b) { return a.ts - b.ts; });
}
function freqMap() {
  var m = {};
  store.entries.forEach(function (e) {
    m[e.customerId] = (m[e.customerId] || 0) + 1;
  });
  return m;
}
function sortedCustomers() {
  var freq = freqMap();
  var last = {};
  store.entries.forEach(function (e) {
    if (!last[e.customerId] || e.ts > last[e.customerId]) { last[e.customerId] = e.ts; }
  });
  return store.customers.slice().sort(function (a, b) {
    var fa = freq[a.id] || 0, fb = freq[b.id] || 0;
    if (fb !== fa) { return fb - fa; }
    var la = last[a.id] || 0, lb = last[b.id] || 0;
    if (lb !== la) { return lb - la; }
    return a.name.localeCompare(b.name);
  });
}
function customerById(id) {
  for (var i = 0; i < store.customers.length; i++) {
    if (store.customers[i].id === id) { return store.customers[i]; }
  }
  return null;
}
function customerTodayTotal(customerId) {
  var baki = 0, paid = 0;
  todayEntries().forEach(function (e) {
    if (e.customerId === customerId) {
      if (e.type === 'baki') { baki += e.amount; } else { paid += e.amount; }
    }
  });
  return { baki: baki, paid: paid, net: baki - paid };
}
/* v2: net = আগের বাকি + আজ নিয়েছে − আজ দিয়েছে (old may be negative = we owe them) */
function customerNet(customerId) {
  var c = customerById(customerId);
  var old = c ? (Number(c.oldBaki) || 0) : 0;
  var t = customerTodayTotal(customerId);
  return { old: old, baki: t.baki, paid: t.paid, net: old + t.baki - t.paid };
}
/* v2: unpaid day-net rolls into আগের বাকি so no money is lost; today's entries reset */
function rolloverDay() {
  store.customers.forEach(function (c) {
    c.oldBaki = customerNet(c.id).net;
  });
  store.dayStart = Date.now();
  saveStore();
}
function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function iconSvg(n) {
  if (n === 'x') { return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>'; }
  return '';
}

/* ================= v2: history-based in-app navigation =================
   Every view/sheet pushes a history state. System back pops to the previous
   view and ends at home. ON HOME back is TRAPPED: the guard state is
   re-pushed, so back NEVER exits the website. */
var currentView = 'home';
var currentSheet = null;
var sheetOnStack = false;
function navState() { return { v: currentView, cid: currentCustomerId, sheet: currentSheet }; }
function pushNav() { history.pushState(navState(), ''); }
function renderState(s) {
  currentView = (s && s.v) || 'home';
  currentCustomerId = (s && s.cid) || null;
  currentSheet = (s && s.sheet) || null;
  sheetOnStack = !!currentSheet;
  if (currentSheet) { openSheetUI(currentSheet); } else { closeSheetsUI(); }
  if (currentView === 'profile' && currentCustomerId) { showView('viewProfile'); renderProfile(currentCustomerId); }
  else if (currentView === 'settings') { showView('viewSettings'); }
  else { showView('viewHome'); renderHome(); }
}
function armHomeGuard() {
  history.pushState({ v: 'home', guard: 1 }, '');
}
if (typeof window !== 'undefined' && window.addEventListener) {
  window.addEventListener('popstate', function (e) {
    var s = (e && e.state) || { v: 'home' };
    if (s.v === 'home' && !s.sheet && !s.guard) {
      /* back pressed while already on home (root reached) — stay, re-arm guard */
      renderState({ v: 'home' });
      armHomeGuard();
      return;
    }
    renderState(s);
  });
}
/* Agradia pattern: in-app back uses history.back() with a home fallback */
function goBack() {
  var popped = false;
  function onPop() { popped = true; window.removeEventListener('popstate', onPop); }
  window.addEventListener('popstate', onPop);
  history.back();
  setTimeout(function () {
    if (!popped) {
      window.removeEventListener('popstate', onPop);
      currentView = 'home'; currentSheet = null;
      renderState(navState());
      armHomeGuard();
    }
  }, 500);
}
function openSheetNav(id) {
  currentSheet = id;
  pushNav();
  sheetOnStack = true;
  openSheetUI(id);
}
function replaceSheetNav(id) {
  currentSheet = id;
  history.replaceState(navState(), '');
  sheetOnStack = true;
  openSheetUI(id);
}
function closeSheetNav() {
  closeSheetsUI();
  if (sheetOnStack) { sheetOnStack = false; history.back(); }
}
function openSheetUI(id) {
  closeSheetsUI();
  el('overlay').classList.add('on');
  el(id).classList.add('on');
}
function closeSheetsUI() {
  el('overlay').classList.remove('on');
  el('sheetAdd').classList.remove('on');
  el('sheetCustomer').classList.remove('on');
}

function renderHome() {
  el('todayDate').textContent = bnDateStr(new Date());
  var list = todayEntries();
  var baki = 0, paid = 0;
  list.forEach(function (e) {
    if (e.type === 'baki') { baki += e.amount; } else { paid += e.amount; }
  });
  el('totalBaki').textContent = fmtTk(baki);
  el('totalPaid').textContent = fmtTk(paid);
  var box = el('entryList');
  var freq = freqMap();
  var cids = [];
  list.forEach(function (e) { if (cids.indexOf(e.customerId) === -1) { cids.push(e.customerId); } });
  var last = {};
  store.entries.forEach(function (e) {
    if (!last[e.customerId] || e.ts > last[e.customerId]) { last[e.customerId] = e.ts; }
  });
  cids.sort(function (a, b) {
    var fa = freq[a] || 0, fb = freq[b] || 0;
    if (fb !== fa) { return fb - fa; }
    return (last[b] || 0) - (last[a] || 0);
  });
  if (!cids.length) {
    box.className = '';
    box.innerHTML = '<div class="empty">আজ এখনো কোনো লেনদেন নেই<br>+ চাপ দিয়ে শুরু করো</div>';
    return;
  }
  box.className = 'grid2';
  var html = '';
  cids.forEach(function (cid) {
    var c = customerById(cid);
    if (!c) { return; }
    var col = colorOf(c);
    var n = customerNet(cid);
    var netHtml;
    if (n.net > 0) { netHtml = '<div class="net2 red">আমি পাবো ' + fmtTk(n.net) + '</div>'; }
    else if (n.net < 0) { netHtml = '<div class="net2 green">সে পাবে ' + fmtTk(-n.net) + '</div>'; }
    else { netHtml = '<div class="net2 zero">হিসাব মিলেছে</div>'; }
    html += '<div class="card" data-cid="' + c.id + '" style="background:' + col.bg + ';border-color:' + col.border + '">'
      + '<div class="nm">' + esc(c.name) + '</div>'
      + '<div class="sub">' + bnDigits(freq[cid] || 0) + ' বার এসেছে</div>'
      + netHtml + '</div>';
  });
  box.innerHTML = html;
  var cards = box.querySelectorAll('.card');
  cards.forEach(function (card) {
    card.addEventListener('click', function () { openProfile(card.getAttribute('data-cid')); });
  });
}
function renderCustomerList() {
  var box = el('customerList');
  var list = sortedCustomers();
  if (!list.length) {
    box.innerHTML = '<div style="color:var(--muted);text-align:center;padding:10px">এখনো কোনো কাস্টমার নেই — নিচে “নতুন কাস্টমার” চাপো</div>';
    return;
  }
  var freq = freqMap();
  var html = '';
  list.forEach(function (c) {
    var col = colorOf(c);
    html += '<div class="namerow" data-cid="' + c.id + '"><span class="cdot" style="background:' + col.border + '"></span><b>' + esc(c.name) + '</b><span class="freq">' + bnDigits(freq[c.id] || 0) + ' বার</span></div>';
  });
  box.innerHTML = html;
  var rows = box.querySelectorAll('.namerow');
  rows.forEach(function (row) {
    row.addEventListener('click', function () { pickCustomer(row.getAttribute('data-cid')); });
  });
}
function renderColorPicker(containerId, selectedIdx, onPick) {
  var box = el(containerId);
  var html = '';
  PALETTE.forEach(function (p, i) {
    html += '<button type="button" class="csw' + (i === selectedIdx ? ' sel' : '') + '" data-ci="' + i + '" style="background:' + p.border + '" aria-label="রং ' + (i + 1) + '"></button>';
  });
  box.innerHTML = html;
  var btns = box.querySelectorAll('.csw');
  btns.forEach(function (b) {
    b.addEventListener('click', function () { onPick(Number(b.getAttribute('data-ci'))); });
  });
}
function showView(name) {
  var views = ['viewHome', 'viewProfile', 'viewSettings'];
  views.forEach(function (v) { el(v).classList.remove('on'); });
  el(name).classList.add('on');
  el('fabBtn').style.display = (name === 'viewHome') ? 'block' : 'none';
  window.scrollTo(0, 0);
}
function pickCustomer(cid) {
  currentCustomerId = cid;
  editingEntryId = null;
  var c = customerById(cid);
  el('calcDot').style.background = colorOf(c).border;
  el('calcName').textContent = c.name;
  setEntryType('baki');
  calcReset();
  el('itemInput').value = '';
  el('addStepPick').style.display = 'none';
  el('addStepCalc').style.display = 'block';
}
function setEntryType(t) {
  entryType = t;
  el('typeBaki').className = t === 'baki' ? 'on-baki' : '';
  el('typePaid').className = t === 'paid' ? 'on-paid' : '';
}
function calcEval(expr) {
  var clean = String(expr).replace(/[×]/g, '*').replace(/[÷]/g, '/').replace(/[−]/g, '-').replace(/[^0-9+\-*/.]/g, '');
  if (!clean) { return null; }
  clean = clean.replace(/([+\-*/])$/, '');
  if (!clean) { return null; }
  var tokens = clean.match(/(\d+\.?\d*|[+\-*/])/g);
  if (!tokens) { return null; }
  var values = [], ops = [];
  function prec(op) { return (op === '*' || op === '/') ? 2 : 1; }
  function applyOp() {
    var op = ops.pop();
    var b = values.pop(), a = values.pop();
    if (a == null || b == null) { return false; }
    if (op === '+') { values.push(a + b); }
    else if (op === '-') { values.push(a - b); }
    else if (op === '*') { values.push(a * b); }
    else if (op === '/') { if (b === 0) { return false; } values.push(a / b); }
    return true;
  }
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    if (/^[0-9]/.test(t)) { values.push(parseFloat(t)); }
    else {
      if (t === '-' && (i === 0 || /[+\-*/]/.test(tokens[i - 1]))) {
        var nxt = tokens[i + 1];
        if (nxt && /^[0-9]/.test(nxt)) { values.push(-parseFloat(nxt)); i++; continue; }
      }
      while (ops.length && prec(ops[ops.length - 1]) >= prec(t)) {
        if (!applyOp()) { return null; }
      }
      ops.push(t);
    }
  }
  while (ops.length) { if (!applyOp()) { return null; } }
  if (values.length !== 1) { return null; }
  return values[0];
}
function calcDisplay() {
  var v = calcEval(calcExpr);
  el('calcExpr').textContent = calcExpr ? bnDigits(calcExpr) : '';
  el('calcValue').textContent = v == null ? '০' : fmtTk(Math.round(v));
}
function calcReset() { calcExpr = ''; calcDisplay(); }
function calcPress(k) {
  if (k === 'AC') { calcExpr = ''; }
  else if (k === 'DEL') { calcExpr = calcExpr.slice(0, -1); }
  else if (k === '=') {
    var v = calcEval(calcExpr);
    if (v != null) { calcExpr = String(Math.round(v)); }
  }
  else if (/[+\-×÷]/.test(k)) {
    if (!calcExpr) { return; }
    if (/[+\-×÷]$/.test(calcExpr)) { calcExpr = calcExpr.slice(0, -1) + k; }
    else { calcExpr += k; }
  }
  else { calcExpr += k; }
  calcDisplay();
}
function saveEntry() {
  var v = calcEval(calcExpr);
  if (v == null || Math.round(v) <= 0) {
    showToast('টাকার অঙ্ক লিখুন');
    return;
  }
  var amount = Math.round(v);
  var item = el('itemInput').value.trim();
  if (editingEntryId) {
    for (var i = 0; i < store.entries.length; i++) {
      if (store.entries[i].id === editingEntryId) {
        store.entries[i].amount = amount;
        store.entries[i].type = entryType;
        store.entries[i].item = item;
        break;
      }
    }
    editingEntryId = null;
  } else {
    var e = { id: 'e' + Date.now(), customerId: currentCustomerId, type: entryType, amount: amount, item: item, ts: Date.now() };
    store.entries.push(e);
    lastUndo = { kind: 'add', entry: e };
  }
  saveStore();
  closeSheetNav();
  renderHome();
  if (currentCustomerId) { renderProfile(currentCustomerId); }
  showToast('সংরক্ষণ হয়েছে', function () {
    if (lastUndo && lastUndo.kind === 'add') {
      store.entries = store.entries.filter(function (x) { return x.id !== lastUndo.entry.id; });
      saveStore(); renderHome();
    }
  });
}
function editEntry(entryId) {
  var e = null;
  for (var i = 0; i < store.entries.length; i++) { if (store.entries[i].id === entryId) { e = store.entries[i]; } }
  if (!e) { return; }
  var c = customerById(e.customerId);
  if (!c) { return; }
  currentCustomerId = c.id;
  editingEntryId = entryId;
  el('calcDot').style.background = colorOf(c).border;
  el('calcName').textContent = c.name;
  setEntryType(e.type);
  calcExpr = String(e.amount);
  calcDisplay();
  el('itemInput').value = e.item || '';
  el('addStepPick').style.display = 'none';
  el('addStepCalc').style.display = 'block';
  openSheetNav('sheetAdd');
}
function deleteEntry(entryId) {
  var e = null;
  store.entries = store.entries.filter(function (x) {
    if (x.id === entryId) { e = x; return false; }
    return true;
  });
  if (!e) { return; }
  saveStore();
  lastUndo = { kind: 'delete', entry: e };
  renderHome();
  renderProfile(e.customerId);
  showToast('মুছে ফেলা হয়েছে', function () {
    if (lastUndo && lastUndo.kind === 'delete') {
      store.entries.push(lastUndo.entry);
      saveStore(); renderHome(); renderProfile(lastUndo.entry.customerId);
    }
  });
}
function openProfile(cid) {
  currentCustomerId = cid;
  currentView = 'profile';
  currentSheet = null;
  pushNav();
  renderState(navState());
}
function renderProfile(cid) {
  var c = customerById(cid);
  if (!c) { return; }
  var col = colorOf(c);
  el('profileDot').style.background = col.border;
  el('profileName').textContent = c.name;
  var n = customerNet(cid);
  var totalEl = el('profileTotal');
  if (n.net > 0) {
    totalEl.textContent = 'আমি পাবো ' + fmtTk(n.net);
    totalEl.style.color = 'var(--red)';
  } else if (n.net < 0) {
    totalEl.textContent = 'সে পাবে ' + fmtTk(-n.net);
    totalEl.style.color = 'var(--green)';
  } else {
    totalEl.textContent = 'আজ কোনো বাকি নেই';
    totalEl.style.color = 'var(--green)';
  }
  el('profileSub').textContent = 'নিয়েছে ' + fmtTk(n.baki) + ' • দিয়েছে ' + fmtTk(n.paid);
  el('profileOldBaki').textContent = fmtTk(n.old);
  el('oldBakiEdit').style.display = 'none';
  el('payAllBtn').style.display = n.net > 0 ? 'block' : 'none';
  renderColorPicker('profileColorSwatches', (typeof c.color === 'number' ? c.color : 0), function (idx) {
    c.color = idx;
    saveStore();
    renderProfile(cid);
    renderHome();
  });
  var list = todayEntries().filter(function (e) { return e.customerId === cid; });
  var box = el('profileEntries');
  if (!list.length) {
    box.innerHTML = '<div class="empty">আজ এই কাস্টমারের কোনো লেনদেন নেই</div>';
    return;
  }
  var html = '';
  list.forEach(function (e) {
    var cls = e.type === 'baki' ? 'red' : 'green';
    var label = e.type === 'baki' ? 'বাকি নিলো' : 'দিয়ে দিলো';
    var note = e.item ? esc(e.item) : 'ব্যাখ্যা নেই';
    html += '<div class="minirow" data-eid="' + e.id + '">'
      + '<div style="flex:1;min-width:0"><b>' + fmtTime(e.ts) + ' • ' + periodLabel(e.ts) + '</b>'
      + '<span style="color:var(--muted)"> ' + label + '</span>'
      + '<div style="font-size:13px;color:var(--muted)">ব্যাখ্যা: ' + note + '</div></div>'
      + '<div style="display:flex;align-items:center;gap:4px"><b style="color:var(--' + cls + ')">' + fmtTk(e.amount) + '</b>'
      + '<button class="x" data-del="' + e.id + '" aria-label="মুছুন">' + iconSvg('x') + '</button></div></div>';
  });
  box.innerHTML = html;
  var rows = box.querySelectorAll('.minirow');
  rows.forEach(function (r) {
    r.addEventListener('click', function (ev) {
      var delBtn = ev.target && ev.target.closest ? ev.target.closest('[data-del]') : null;
      if (delBtn) { return; }
      editEntry(r.getAttribute('data-eid'));
    });
  });
  var dels = box.querySelectorAll('[data-del]');
  dels.forEach(function (b) {
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      deleteEntry(b.getAttribute('data-del'));
    });
  });
}
function payAll(cid) {
  var n = customerNet(cid);
  if (n.net <= 0) { return; }
  store.entries.push({ id: 'e' + Date.now(), customerId: cid, type: 'paid', amount: n.net, item: 'পুরো শোধ', ts: Date.now() });
  saveStore();
  renderHome();
  renderProfile(cid);
  showToast('পুরো টাকা আদায় লেখা হয়েছে');
}
function buildSummary() {
  var list = todayEntries();
  var baki = 0, paid = 0;
  var per = {};
  list.forEach(function (e) {
    var c = customerById(e.customerId);
    var name = c ? c.name : 'অজানা';
    if (!per[name]) { per[name] = { baki: 0, paid: 0, old: 0, id: e.customerId }; }
    if (e.type === 'baki') { baki += e.amount; per[name].baki += e.amount; }
    else { paid += e.amount; per[name].paid += e.amount; }
  });
  var lines = [];
  lines.push('দোকান হিসাব — ' + bnDateStr(new Date()));
  lines.push('আজ বাকি গেলো: ' + fmtTk(baki));
  lines.push('আজ আদায়: ' + fmtTk(paid));
  lines.push('আজ মোট পাবো: ' + fmtTk(baki - paid));
  var oldTotal = 0, netTotal = 0;
  Object.keys(per).forEach(function (name) {
    var p = per[name];
    var cc = customerById(p.id);
    p.old = cc ? (Number(cc.oldBaki) || 0) : 0;
    oldTotal += p.old;
    netTotal += p.old + p.baki - p.paid;
  });
  if (oldTotal !== 0) { lines.push('আগের বাকিসহ মোট পাবো: ' + fmtTk(netTotal)); }
  lines.push('---');
  Object.keys(per).forEach(function (name) {
    var p = per[name];
    var parts = [];
    if (p.old) { parts.push('আগের বাকি ' + fmtTk(p.old)); }
    if (p.baki) { parts.push('বাকি ' + fmtTk(p.baki)); }
    if (p.paid) { parts.push('দিয়েছে ' + fmtTk(p.paid)); }
    lines.push(name + ' — ' + parts.join(', '));
  });
  if (!list.length) { lines.push('আজ কোনো লেনদেন হয়নি।'); }
  return lines.join('\n');
}
function applySettings() {
  document.body.setAttribute('data-theme', store.theme || 'green');
  document.body.classList.toggle('large-font', !!store.fontLarge);
  var sws = document.querySelectorAll('#themeSwatches .swatch');
  sws.forEach(function (s) { s.classList.toggle('sel', s.getAttribute('data-theme') === store.theme); });
  el('fontNormal').className = store.fontLarge ? '' : 'on-baki';
  el('fontLarge').className = store.fontLarge ? 'on-baki' : '';
}
function showToast(msg, undoFn) {
  var t = el('toast');
  el('toastMsg').textContent = msg;
  var ub = el('toastUndo');
  ub.style.display = undoFn ? 'inline' : 'none';
  ub.onclick = function () {
    if (undoFn) { undoFn(); }
    t.classList.remove('show');
  };
  t.classList.add('show');
  if (toastTimer) { clearTimeout(toastTimer); }
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 5000);
}
function pickNewColor(idx) {
  newCustColor = idx;
  renderColorPicker('newCustomerColors', newCustColor, pickNewColor);
}
function saveCustomer() {  var name = el('newNameInput').value.trim();
  if (!name) { showToast('নাম লিখুন'); return; }
  var oldRaw = el('newOldBakiInput').value;
  var oldBaki = Math.max(0, Math.round(Number(oldRaw) || 0));
  var c = { id: 'c' + Date.now(), name: name, color: newCustColor, oldBaki: oldBaki, createdAt: Date.now() };
  store.customers.push(c);
  saveStore();
  el('newNameInput').value = '';
  el('newOldBakiInput').value = '';
  pickCustomer(c.id);
  replaceSheetNav('sheetAdd');
}
function init() {
  loadStore();
  applySettings();
  renderHome();
  el('todayDate').textContent = bnDateStr(new Date());
  /* v2: arm the home guard so Android back on home never exits the site */
  if (typeof history !== 'undefined' && history.replaceState) {
    history.replaceState({ v: 'home' }, '');
    armHomeGuard();
  }
  el('fabBtn').addEventListener('click', function () {
    el('addStepPick').style.display = 'block';
    el('addStepCalc').style.display = 'none';
    renderCustomerList();
    openSheetNav('sheetAdd');
  });
  el('overlay').addEventListener('click', closeSheetNav);
  el('settingsBtn').addEventListener('click', function () {
    currentView = 'settings'; currentSheet = null;
    pushNav();
    renderState(navState());
  });
  el('settingsBack').addEventListener('click', goBack);
  el('profileBack').addEventListener('click', goBack);
  el('newCustomerLink').addEventListener('click', function () {
    newCustColor = nextColorIdx();
    el('newNameInput').value = '';
    el('newOldBakiInput').value = '';
    renderColorPicker('newCustomerColors', newCustColor, pickNewColor);
    replaceSheetNav('sheetCustomer');
  });
  el('saveCustomerBtn').addEventListener('click', saveCustomer);
  el('typeBaki').addEventListener('click', function () { setEntryType('baki'); });
  el('typePaid').addEventListener('click', function () { setEntryType('paid'); });
  el('saveEntryBtn').addEventListener('click', saveEntry);
  el('calcBackBtn').addEventListener('click', function () {
    editingEntryId = null;
    el('addStepPick').style.display = 'block';
    el('addStepCalc').style.display = 'none';
    renderCustomerList();
  });
  var keys = el('keypad').querySelectorAll('button');
  keys.forEach(function (b) {
    b.addEventListener('click', function () { calcPress(b.getAttribute('data-k')); });
  });
  el('payAllBtn').addEventListener('click', function () { payAll(currentCustomerId); });
  el('editOldBakiBtn').addEventListener('click', function () {
    var c = customerById(currentCustomerId);
    if (!c) { return; }
    el('oldBakiInput').value = String(Number(c.oldBaki) || 0);
    el('oldBakiEdit').style.display = 'block';
  });
  el('saveOldBakiBtn').addEventListener('click', function () {
    var c = customerById(currentCustomerId);
    if (!c) { return; }
    var v = Math.round(Number(el('oldBakiInput').value) || 0);
    c.oldBaki = v;
    saveStore();
    renderProfile(currentCustomerId);
    renderHome();
    showToast('আগের বাকি সেভ হয়েছে');
  });
  var sws = document.querySelectorAll('#themeSwatches .swatch');
  sws.forEach(function (s) {
    s.addEventListener('click', function () {
      store.theme = s.getAttribute('data-theme');
      saveStore();
      applySettings();
    });
  });
  el('fontNormal').addEventListener('click', function () { store.fontLarge = false; saveStore(); applySettings(); });
  el('fontLarge').addEventListener('click', function () { store.fontLarge = true; saveStore(); applySettings(); });
  el('newDayBtn').addEventListener('click', function () {
    if (typeof confirm === 'function' && !confirm('নতুন দিন শুরু করবে? আজকের না-মেটা বাকি আগের বাকিতে চলে যাবে, আর আজকের লিস্ট খালি হয়ে যাবে।')) { return; }
    rolloverDay();
    renderHome();
    showToast('নতুন দিন শুরু হয়েছে');
  });
  el('summaryBtn').addEventListener('click', function () {
    var text = buildSummary();
    var box = el('summaryBox');
    box.style.display = 'block';
    box.value = text;
    function done() { showToast('সারাংশ কপি হয়েছে'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { box.select(); done(); });
    } else { box.select(); done(); }
  });
  el('clearTodayBtn').addEventListener('click', function () {
    if (typeof confirm === 'function' && !confirm('আজকের সব লেনদেন মুছে ফেলবে? (আগের বাকি মুছবে না)')) { return; }
    var tk = dayKey(Date.now());
    var ds = effectiveDayStart();
    store.entries = store.entries.filter(function (e) { return !(dayKey(e.ts) === tk && e.ts >= ds); });
    saveStore();
    renderHome();
    showToast('আজকের ডাটা মোছা হয়েছে');
  });
  if (typeof navigator !== 'undefined' && navigator.serviceWorker) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
}
if (typeof document !== 'undefined') { init(); }
